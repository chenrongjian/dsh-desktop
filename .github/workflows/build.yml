name: Build Desktop Bundles

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Packages will be published to this tag."
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
          key: ${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Fetch ffmpeg binary
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          case "${{ matrix.platform }}" in
            macos-*)
              curl -sL -o /tmp/ff.zip "https://evermeet.cx/ffmpeg/getrelease/zip"
              unzip -o /tmp/ff.zip -d src-tauri/binaries/
              chmod +x src-tauri/binaries/ffmpeg
              ;;
            windows-*)
              curl -sL -o /tmp/ff.zip "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
              powershell -Command "Expand-Archive -Force /tmp/ff.zip -DestinationPath /tmp/ffx"
              find /tmp/ffx -name ffmpeg.exe | head -1 | xargs -I{} cp {} src-tauri/binaries/ffmpeg.exe
              ;;
            ubuntu-*)
              curl -sL -o /tmp/ff.tar.xz "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
              mkdir -p /tmp/ffx && tar xJf /tmp/ff.tar.xz -C /tmp/ffx
              find /tmp/ffx -name ffmpeg -type f | head -1 | xargs -I{} cp {} src-tauri/binaries/ffmpeg
              chmod +x src-tauri/binaries/ffmpeg
              ;;
          esac
          ls -la src-tauri/binaries/

      - name: Build app bundles
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}-${{ matrix.target }}
          path: |
            src-tauri/target/**/release/bundle/
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Collect bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles
          pattern: bundle-*
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
          generate_release_notes: true
          fail_on_unmatched: false
          files: |
            bundles/*.dmg
            bundles/*.app.tar.gz
            bundles/*.msi
            bundles/*.exe
            bundles/*.AppImage
            bundles/*.deb
            bundles/*.rpm
