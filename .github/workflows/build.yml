name: Build Desktop Bundles

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Packages will be published to this tag."
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout deepseek-harness source
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          path: dsh-harness

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libpipewire-0.3-dev libspa-0.2-dev libasound2-dev libssl-dev libfuse2t64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
          key: ${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Fetch ffmpeg binary
        shell: bash
        run: |
          mkdir -p src-tauri/binaries .ff_tmp
          # 校验产物:必须存在且大于 1MB,防止下载到 HTML 错误页被静默放过
          verify() {
            local f="$1"
            [ -f "$f" ] || return 1
            local sz; sz=$(wc -c < "$f")
            [ "$sz" -gt 1000000 ] || return 1
          }
          case "${{ matrix.platform }}" in
            macos-*)
              curl -sL --retry 3 --max-time 600 -o .ff_tmp/ff.zip "https://evermeet.cx/ffmpeg/getrelease/zip"
              unzip -tq .ff_tmp/ff.zip || { echo "::error::ffmpeg zip 校验失败"; exit 1; }
              unzip -o .ff_tmp/ff.zip -d src-tauri/binaries/
              chmod +x src-tauri/binaries/ffmpeg
              verify src-tauri/binaries/ffmpeg || { echo "::error::ffmpeg 无效"; exit 1; }
              ;;
            windows-*)
              curl -sL --retry 3 --max-time 600 -o .ff_tmp/ff.zip "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
              "/c/Windows/System32/tar.exe" -xf .ff_tmp/ff.zip -C .ff_tmp
              find .ff_tmp -name ffmpeg.exe | head -1 | xargs -I{} cp {} src-tauri/binaries/ffmpeg.exe
              verify src-tauri/binaries/ffmpeg.exe || { echo "::error::ffmpeg.exe 无效"; exit 1; }
              ;;
            ubuntu-*)
              # johnvansickle 源不稳定(常返回非 xz 内容),以 GitHub 托管的 BtbN 静态构建为主源
              ok=0
              for url in \
                "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" \
                "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"; do
                echo "尝试 ffmpeg 源: $url"
                rm -f .ff_tmp/ff.tar.xz
                rm -rf .ff_tmp/ffx
                if curl -sL --retry 3 --max-time 600 -A "Mozilla/5.0 (X11; Linux x86_64)" -o .ff_tmp/ff.tar.xz "$url" \
                   && xz -t .ff_tmp/ff.tar.xz 2>/dev/null; then
                  mkdir -p .ff_tmp/ffx
                  tar xJf .ff_tmp/ff.tar.xz -C .ff_tmp/ffx
                  found=$(find .ff_tmp/ffx -name ffmpeg -type f | head -1)
                  if [ -n "$found" ]; then
                    cp "$found" src-tauri/binaries/ffmpeg
                    chmod +x src-tauri/binaries/ffmpeg
                    ok=1
                    break
                  fi
                fi
                echo "该源不可用,尝试下一个"
              done
              [ "$ok" = "1" ] || { echo "::error::所有 ffmpeg 下载源均失败"; exit 1; }
              verify src-tauri/binaries/ffmpeg || { echo "::error::ffmpeg 无效"; exit 1; }
              ;;
          esac
          rm -rf .ff_tmp
          ls -la src-tauri/binaries/

      - name: Use ASCII product name on Windows
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          # WiX light.exe 无法处理非 ASCII 输出名(如 鲸灵_0.1.1_x64_en-US.msi),会导致 MSI 打包失败
          # 仅 Windows 构建临时改用 ASCII 产品名,窗口标题仍由 app.windows[].title 控制,保持中文
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.productName='DSH Desktop';fs.writeFileSync(f,JSON.stringify(j,null,2)+String.fromCharCode(10));"
          node -e "const fs=require('fs');console.log('productName ->', JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')).productName)"

      - name: Build app bundles
        env:
          # 指向 checkout 的 deepseek-harness 源码，beforeBuildCommand 据此装配内置 dsh-runtime
          DSH_PROJECT_DIR: ${{ github.workspace }}/dsh-harness
        run: |
          if [ "${{ matrix.platform }}" = "ubuntu-24.04" ]; then
            # linuxdeploy AppImage 打包在 CI 上已两轮失败（tauri-bundler 吞掉真实 stderr），Linux 只出 deb/rpm
            pnpm tauri build --target ${{ matrix.target }} --bundles deb,rpm
          else
            pnpm tauri build --target ${{ matrix.target }}
          fi

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}-${{ matrix.target }}
          path: |
            src-tauri/target/**/release/bundle/
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Collect bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles
          pattern: bundle-*
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
          generate_release_notes: true
          fail_on_unmatched: false
          files: |
            bundles/**/*.dmg
            bundles/**/*.app.tar.gz
            bundles/**/*.msi
            bundles/**/*.exe
            bundles/**/*.AppImage
            bundles/**/*.deb
            bundles/**/*.rpm
