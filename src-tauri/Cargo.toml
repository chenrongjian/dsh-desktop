[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DeepSeek Harness Desktop — Tauri 2 + Rust supervisor"
authors = ["chenrongjian"]
edition = "2021"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
futures-util = "0.3"
thiserror = "2"
scap = "0.0.8"
cpal = "0.15"
dasp_sample = "0.11"

[patch.crates-io]
scap = { path = "vendor/scap-0.0.8" }

[profile.release]
strip = true
lto = true
codegen-units = 1
